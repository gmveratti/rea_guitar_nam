name: Bootstrap VTTRIG dependency lockfiles

on:
  push:
    branches: [chore/32-reproducible-builds]
    paths:
      - .github/workflows/bootstrap-lockfiles.yml

permissions:
  contents: write

jobs:
  generate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - name: Generate npm and Cargo lockfiles from real registries
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          npm ci --ignore-scripts --no-audit --no-fund
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null
      - name: Commit lockfiles on this isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --exit-code && exit 0
          git commit -m 'chore(deps): version actual npm and Cargo dependency locks'
          git push origin HEAD:chore/32-reproducible-builds
