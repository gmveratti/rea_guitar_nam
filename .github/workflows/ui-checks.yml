name: VTTRIG UI quality

on:
  pull_request:
  push:
    branches:
      - main
      - feat/tauri-pedalboard-foundation

permissions:
  contents: read

jobs:
  frontend:
    name: Build, unit and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vttrig-ui-artifacts
          path: test-results/
          if-no-files-found: ignore
