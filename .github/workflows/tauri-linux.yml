name: VTTRIG Tauri Linux

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: vttrig-tauri-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  tauri-check:
    name: Linux desktop and AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target
      - name: Install WebKitGTK build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libjack-jackd2-dev libasound2-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - name: Validate AppImage icon (regression check)
        run: python3 scripts/check_tauri_icons.py
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Mirror Eigen upstream during GitLab outage
        run: |
          git config --global url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen.git"
          git config --global --add url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Compile and stage live NAM/IR sidecar
        shell: bash
        run: |
          set -euo pipefail
          cmake -S engine -B engine/build-live -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DVTTRIG_BUILD_JACK=OFF
          cmake --build engine/build-live --config Release --target vttrig-nam-live --parallel 2
          ctest --test-dir engine/build-live -C Release --output-on-failure -R "live_sidecar"
          mkdir -p src-tauri/binaries
          triple="$(rustc --print host-tuple)"
          cp engine/build-live/vttrig-nam-live "src-tauri/binaries/vttrig-nam-live-$triple"
          chmod +x "src-tauri/binaries/vttrig-nam-live-$triple"
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy (deny warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build VTTRIG AppImage (x86_64)
        if: github.event_name == 'release'
        run: npx tauri build --bundles appimage
      - name: Validate Linux executables
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -gt 0
          test -f src-tauri/target/release/vttrig
          ls -lh "${images[@]}" src-tauri/target/release/vttrig
      - name: Publish downloadable Fedora/Linux test build
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VTTRIG-Linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/vttrig
          if-no-files-found: error
          retention-days: 14

