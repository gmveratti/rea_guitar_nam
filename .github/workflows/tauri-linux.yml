name: VTTRIG Tauri Linux

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tauri-check:
    name: Linux desktop and AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install WebKitGTK build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - name: Validate AppImage icon (regression check)
        run: python3 scripts/check_tauri_icons.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Mirror Eigen upstream during GitLab outage
        run: |
          git config --global url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen.git"
          git config --global --add url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Compile and stage live NAM/IR sidecar
        shell: bash
        run: |
          set -euo pipefail
          cmake -S engine -B engine/build-live -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DVTTRIG_BUILD_JACK=OFF
          cmake --build engine/build-live --config Release --target vttrig-nam-live --parallel 2
          ctest --test-dir engine/build-live -C Release --output-on-failure -R "live_sidecar"
          mkdir -p src-tauri/binaries
          triple="$(rustc --print host-tuple)"
          cp engine/build-live/vttrig-nam-live "src-tauri/binaries/vttrig-nam-live-$triple"
          chmod +x "src-tauri/binaries/vttrig-nam-live-$triple"
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build VTTRIG AppImage (x86_64)
        if: github.event_name == 'release'
        run: npx tauri build --bundles appimage
      - name: Validate Linux executables
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -gt 0
          test -f src-tauri/target/release/vttrig
          ls -lh "${images[@]}" src-tauri/target/release/vttrig
      - name: Publish downloadable Fedora/Linux test build
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: VTTRIG-Linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/vttrig
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach AppImage to GitHub Release
    if: github.event_name == 'release'
    needs: tauri-check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VTTRIG-Linux-x86_64
          path: release-assets
      - name: Attach Linux AppImage to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(release-assets/*.AppImage)
          test "${#images[@]}" -eq 1
          gh release upload "$RELEASE_TAG" "${images[@]}" --clobber
