name: VTTRIG Tauri Windows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows x64 NSIS installer
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build React UI
        run: npm run build
      - name: Run shared UI unit tests
        run: npm test

      # The source PNG is shared with the Linux AppImage. Windows requires an
      # actual .ico; generate it on the runner without committing binary files.
      - name: Validate original VTTRIG icon
        run: python scripts/check_tauri_icons.py
      - name: Generate Windows ICO from VTTRIG branding
        run: npx tauri icon src-tauri/icons/icon.png --output src-tauri/icons
      - name: Run Windows bundle regression tests
        run: python -m unittest discover -s scripts -p "test_windows_bundle.py" -v
      - name: Check Windows bundle config and generated ICO
        run: python scripts/check_windows_bundle.py --preflight

      - name: Mirror Eigen upstream during GitLab outage
        shell: pwsh
        run: |
          git config --global url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen.git"
          git config --global --add url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Compile and stage live NAM/IR sidecar
        shell: pwsh
        run: |
          cmake -S engine -B engine/build-live -DBUILD_TESTING=ON -DVTTRIG_BUILD_JACK=OFF
          cmake --build engine/build-live --config Release --target vttrig-nam-live --parallel 2
          ctest --test-dir engine/build-live -C Release --output-on-failure -R "live_sidecar"
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $triple = (rustc --print host-tuple).Trim()
          Copy-Item engine/build-live/Release/vttrig-nam-live.exe "src-tauri/binaries/vttrig-nam-live-$triple.exe"

      - name: Check Windows Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build VTTRIG installer for Windows x64
        run: npx tauri build --bundles nsis
      - name: Validate NSIS installer and desktop executable
        run: python scripts/check_windows_bundle.py --postbuild
      - name: Publish Windows installer download
        uses: actions/upload-artifact@v4
        with:
          name: VTTRIG-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
