name: VTTRIG Tauri Windows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows x64 NSIS installer
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.0"
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build React UI
        run: npm run build
      - name: Run shared UI unit tests
        run: npm test

      # The source PNG is shared with the Linux AppImage. Windows requires an
      # actual .ico; generate it on the runner without committing binary files.
      - name: Validate original VTTRIG icon
        run: python scripts/check_tauri_icons.py
      - name: Generate Windows ICO from VTTRIG branding
        run: npx tauri icon src-tauri/icons/icon.png --output src-tauri/icons
      - name: Run Windows bundle regression tests
        run: python -m unittest discover -s scripts -p "test_windows_bundle.py" -v
      - name: Check Windows bundle config and generated ICO
        run: python scripts/check_windows_bundle.py --preflight

      - name: Mirror Eigen upstream during GitLab outage
        shell: pwsh
        run: |
          git config --global url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen.git"
          git config --global --add url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Compile and stage live NAM/IR sidecar
        shell: pwsh
        run: |
          cmake -S engine -B engine/build-live -DBUILD_TESTING=ON -DVTTRIG_BUILD_JACK=OFF
          cmake --build engine/build-live --config Release --target vttrig-nam-live --parallel 2
          ctest --test-dir engine/build-live -C Release --output-on-failure -R "live_sidecar"
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          $triple = (rustc --print host-tuple).Trim()
          Copy-Item engine/build-live/Release/vttrig-nam-live.exe "src-tauri/binaries/vttrig-nam-live-$triple.exe"

      - name: Check Windows Rust code
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy (deny warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build VTTRIG installer for Windows x64
        if: github.event_name == 'release'
        run: npx tauri build --bundles nsis
      - name: Validate NSIS installer and desktop executable
        if: github.event_name == 'release'
        run: python scripts/check_windows_bundle.py --postbuild
      - name: Publish Windows installer download
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VTTRIG-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach NSIS installer to GitHub Release
    if: github.event_name == 'release'
    needs: windows-installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: VTTRIG-Windows-x64
          path: release-assets
      - name: Attach Windows installer to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release-assets/*-setup.exe)
          test "${#installers[@]}" -eq 1
          gh release upload "$RELEASE_TAG" "${installers[@]}" --clobber --repo "$GITHUB_REPOSITORY"
