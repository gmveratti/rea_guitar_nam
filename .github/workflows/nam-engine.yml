name: VTTRIG NAM cross-platform DSP

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/nam-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/nam-engine.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    name: Portable NAM core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Linux JACK adapter dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libjack-jackd2-dev git

      - name: Mirror Eigen upstream during GitLab outage
        shell: bash
        run: |
          git config --global url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen.git"
          git config --global --add url."https://eigen.googlesource.com/mirror".insteadOf "https://gitlab.com/libeigen/eigen"
      - name: Validate notice packaging without distributing binaries
        run: python -m unittest discover -s scripts -p "test_standalone_bundle.py" -v
      - name: Configure pinned NAM Core and native tests
        run: cmake -S engine -B engine/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build portable DSP and platform host
        run: cmake --build engine/build --config Release --parallel 2
      - name: Run regressions on this OS
        run: ctest --test-dir engine/build -C Release --output-on-failure

      - name: Verify Windows offline binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = "engine/build/Release/vttrig-nam-offline.exe"
          if (-not (Test-Path $file)) { throw "Expected Windows NAM offline binary: $file" }
          & $file --help
      - name: Package Windows NAM processor with licenses
        if: github.event_name == 'release' && runner.os == 'Windows'
        run: >-
          python scripts/package_standalone.py
          --binary engine/build/Release/vttrig-nam-offline.exe
          --notices engine/THIRD_PARTY_NOTICES.md
          --nam-core-license engine/build/_deps/namcore-src/LICENSE
          --output engine/build/VTTRIG-NAM-Offline-Windows-x64.zip
      - name: Publish standalone Windows NAM processor
        if: github.event_name == 'release' && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VTTRIG-NAM-Offline-Windows-x64
          path: engine/build/VTTRIG-NAM-Offline-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Package Linux NAM processor with licenses
        if: github.event_name == 'release' && runner.os == 'Linux'
        run: >-
          python3 scripts/package_standalone.py
          --binary engine/build/vttrig-nam-offline
          --notices engine/THIRD_PARTY_NOTICES.md
          --nam-core-license engine/build/_deps/namcore-src/LICENSE
          --output engine/build/VTTRIG-NAM-Offline-Linux-x64.zip
      - name: Publish standalone Linux NAM processor
        if: github.event_name == 'release' && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VTTRIG-NAM-Offline-Linux-x64
          path: engine/build/VTTRIG-NAM-Offline-Linux-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach standalone NAM processors to GitHub Release
    if: github.event_name == 'release'
    needs: native-core
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: VTTRIG-NAM-Offline-Windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: VTTRIG-NAM-Offline-Linux-x64
          path: release-assets/linux
      - name: Attach Windows and Linux processors to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/windows/VTTRIG-NAM-Offline-Windows-x64.zip
          test -f release-assets/linux/VTTRIG-NAM-Offline-Linux-x64.zip
          gh release upload "$RELEASE_TAG" \
            release-assets/windows/VTTRIG-NAM-Offline-Windows-x64.zip \
            release-assets/linux/VTTRIG-NAM-Offline-Linux-x64.zip --clobber --repo "$GITHUB_REPOSITORY"
