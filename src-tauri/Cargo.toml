[package]
name = "vttrig"
version = "0.1.0"
edition = "2021"
description = "VTTRIG interactive guitar pedalboard"
license = "MIT"

[lib]
name = "rea_guitar_nam"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
cpal = { version = "0.17", default-features = true }
rtrb = "0.3"
serde_json = "1"
tauri-plugin-dialog = "2"

# CPAL backends are intentionally selectable only when compiled and present.
# ASIO requires Steinberg SDK/toolchain setup and is NOT enabled in default CI.
[features]
default = []
asio = ["cpal/asio"]
jack = ["cpal/jack"]
