[package]
name = "vttrig"
version = "0.1.0"
edition = "2021"
description = "VTTRIG interactive guitar pedalboard"
license = "MIT"

[lib]
name = "rea_guitar_nam"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
cpal = { version = "0.17", default-features = true }
rtrb = "0.3"
serde_json = "1"
tauri-plugin-dialog = "2"

# Linux desktop always includes the JACK backend so PipeWire-JACK can be
# selected in Settings. Windows keeps WASAPI as its only default backend.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.17", features = ["jack"] }

# ASIO requires Steinberg SDK/toolchain setup and is NOT enabled in default CI.
# The Linux target-specific dependency above enables JACK on Linux only.
[features]
default = []
asio = ["cpal/asio"]
jack = ["cpal/jack"]
