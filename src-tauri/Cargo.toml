[package]
name = "vttrig"
version = "0.1.2"
edition = "2021"
description = "VTTRIG interactive guitar pedalboard"
license = "MIT"

[lib]
name = "rea_guitar_nam"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
cpal = { version = "0.17", default-features = true }
rtrb = "0.3"
serde_json = "1"
tauri-plugin-dialog = "2"

# Linux desktop always includes the JACK backend so PipeWire-JACK can be
# selected in Settings.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.17", features = ["jack"] }

# Official Windows builds always contain both WASAPI and ASIO. The SDK and
# libclang are provisioned by scripts/setup_asio.py and the Windows workflow.
[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.17", features = ["asio"] }

# Feature aliases remain available for explicit development builds.
[features]
default = []
asio = ["cpal/asio"]
jack = ["cpal/jack"]
